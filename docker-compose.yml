version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-server
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?Define RABBITMQ_PASS en .env}
    restart: always

  pedidos-service:
    build: 
      context: ./pedidos360-backend-pedidos
    container_name: pedidos-api
    ports:
      - "8080:8080"
    depends_on:
      - rabbitmq
    restart: always
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_PASS: ${RABBITMQ_PASS:?Define RABBITMQ_PASS en .env}

  notificaciones-service:
    build: 
      context: ./pedidos360-backend-notificaciones
    container_name: notificaciones-worker
    ports:
      - "8081:8081"
    depends_on:
      - rabbitmq
    restart: always
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_PASS: ${RABBITMQ_PASS:?Define RABBITMQ_PASS en .env}

  nginx:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - pedidos-service
      - notificaciones-service
    restart: always
  rabbit-admin:
    build: ./pedidos360-backend-rabbit-admin
    container_name: rabbit-admin
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_PASS: ${RABBITMQ_PASS:?Define RABBITMQ_PASS en .env}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:?Define ADMIN_PASS en .env}
    depends_on:
      - rabbitmq
