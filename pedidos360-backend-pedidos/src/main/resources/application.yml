server:
  port: 8080

spring:
  application:
    name: pedidos-service

  # --- CONFIGURACIÓN H2 ---
  datasource:
    url: jdbc:h2:mem:pedidos360_db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  # --- SEGURIDAD ---
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/8e80f94c-2366-4206-8648-dd4a63286b84/v2.0
          jwk-set-uri: https://login.microsoftonline.com/8e80f94c-2366-4206-8648-dd4a63286b84/discovery/v2.0/keys

  # --- RABBITMQ ---
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}